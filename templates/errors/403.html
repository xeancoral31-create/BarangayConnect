<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 Forbidden | BarangayConnect</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="container text-center py-5">
        <div class="mb-3">
            <i class="bi bi-shield-lock-fill text-danger" style="font-size: 2.75rem;"></i>
        </div>
        <h1 class="display-4 fw-700 text-dark mb-2">403</h1>
        <h2 class="h4 text-secondary mb-3">Access Forbidden</h2>
        <p class="text-muted mx-auto mb-4" style="max-width: 480px;">
            You do not have administrative clearance or necessary permissions to view this resource.
        </p>
        <div class="d-flex justify-content-center gap-2">
            <a href="javascript:history.back()" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i>Go Back
            </a>
            <a href="{% url 'dashboard:index' %}" class="btn btn-primary">
                <i class="bi bi-house-door-fill me-1"></i>Return to Dashboard
            </a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
